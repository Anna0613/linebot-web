services:
  # 後端 API 服務
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: botcraft-backend
    ports:
      - "8001:8005"
    env_file:
      - ./backend/.env
      - ./frontend/.env
    volumes:
      - ./backend/media:/app/media
      - ./backend/logs:/app/logs
    restart: unless-stopped
    networks:
      - botcraft-network
    # 資源限制
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 768M
    # 日誌配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
        compress: "true"
        labels: "service=botcraft-backend"

  # 前端服務
  frontend:
    build:
      context: .  # 使用專案根目錄作為構建上下文
      dockerfile: ./frontend/Dockerfile
      args:
        - VITE_UNIFIED_API_URL=https://linebot-api.jkl921102.org
        - VITE_WEBHOOK_DOMAIN=https://linebot-api.jkl921102.org
        - VITE_DOMAIN=https://linebot-api.jkl921102.org
        - REACT_APP_DOMAIN=https://linebot-api.jkl921102.org
        - VITE_ALLOWED_HOSTS=localhost,127.0.0.1,linebot.jkl921102.org,linebot-api.jkl921102.org
        - VITE_DEV_SERVER_HOST=0.0.0.0
        - VITE_DEV_SERVER_PORT=3000
        - VITE_PROXY_SECURE=true
        - VITE_PROXY_CHANGE_ORIGIN=true
    container_name: botcraft-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - botcraft-network
    # 資源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    # 日誌配置
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"
        compress: "true"
        labels: "service=botcraft-frontend"

  # PostgreSQL 從庫（讀取）
  postgresql-replica:
    image: pgvector/pgvector:pg15
    container_name: postgresql15-replica1
    environment:
      POSTGRES_USER: 11131230
      POSTGRES_PASSWORD: 11131230
      POSTGRES_DB: linebot
      TZ: America/Los_Angeles
    volumes:
      - /mnt/cache/appdata/postgresql15-replica1:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - botcraft-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U 11131230"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  botcraft-network:
    driver: bridge
