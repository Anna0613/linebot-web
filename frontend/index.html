<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="content-language" content="zh-TW" />

    <!-- Critical resource hints for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://infragrid.v.network" crossorigin />
    <!-- API 伺服器連接提示 - 將在運行時由 JavaScript 動態設置 -->
    <link rel="dns-prefetch" href="//infragrid.v.network" />
    <script>
      // 動態設置 API 伺服器的 preconnect 和 dns-prefetch
      (function() {
        // 根據當前頁面位置決定 API 伺服器
        let apiOrigin = 'http://localhost:8000';

        if (typeof window !== 'undefined') {
          const hostname = window.location.hostname;
          const protocol = window.location.protocol;

          // 如果不是本地開發環境，使用當前域名或其 API 子域名
          if (hostname !== 'localhost' && hostname !== '127.0.0.1') {
            if (hostname.includes('linebot.')) {
              // linebot.jkl921102.org -> api.jkl921102.org
              apiOrigin = protocol + '//api.' + hostname.replace('linebot.', '');
            } else {
              // 使用當前域名
              apiOrigin = protocol + '//' + hostname;
            }
          }
        }

        // 添加 preconnect
        const preconnect = document.createElement('link');
        preconnect.rel = 'preconnect';
        preconnect.href = apiOrigin;
        preconnect.crossOrigin = 'anonymous';
        document.head.appendChild(preconnect);

        // 添加 dns-prefetch
        const dnsPrefetch = document.createElement('link');
        dnsPrefetch.rel = 'dns-prefetch';
        dnsPrefetch.href = '//' + new URL(apiOrigin).hostname;
        document.head.appendChild(dnsPrefetch);
      })();
    </script>

    <!-- Preload critical resources -->
    <!-- 使用 prefetch 避免未即時使用造成的 preload 警告 -->
    <link rel="prefetch" href="/assets/images/webp/LOGO.webp" as="image" type="image/webp" />

    <!-- Prefetch likely next resources -->
    <!-- start.tsx 由 Vite 自動處理，不需要手動 preload -->
    <link rel="prefetch" href="/src/pages/DashboardPage.tsx" as="script" />
    <link rel="prefetch" href="/src/pages/LoginPage.tsx" as="script" />

    <!-- Early apply theme to avoid FOUC -->
    <script>
      try {
        const saved = localStorage.getItem('theme');
        const prefers = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        const dark = saved ? saved === 'dark' : prefers;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) { /* no-op */ }
    </script>

    <!-- Module preload will be handled by Vite in production -->

    <link rel="icon" href="/assets/images/logo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#25242d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Botcraft" />
    <title>Botcraft | 視覺化對話機器人建構平台</title>
    <meta name="description" content="Botcraft 是一個視覺化的對話流程編輯平台。把訊息積木拖一拖，串起來，就能在 LINE、Web 與各種通訊管道上跑起來，不用寫一行程式碼。" />
    <meta name="author" content="Botcraft Studio" />
    <meta name="keywords" content="Botcraft, LINE Bot, 對話機器人, 視覺化流程編輯, LINE Messaging API, Flex Message, Rich Menu, AI 知識庫, RAG" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Botcraft | 視覺化對話機器人建構平台" />
    <meta property="og:description" content="把對話機器人，做成你想要的樣子。視覺化流程、Flex 訊息、Rich Menu、AI 知識庫與 LINE 整合都在一個工作台。" />
    <meta property="og:image" content="/專題圖片/logo.svg" />
    <meta property="og:url" content="https://linebot-web.com" />
    <meta property="og:site_name" content="Botcraft" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Botcraft | 視覺化對話機器人建構平台" />
    <meta name="twitter:description" content="用拖拉式流程、Flex 訊息、Rich Menu 與 AI 知識庫快速建立 Bot。" />
    <meta name="twitter:image" content="/專題圖片/logo.svg" />

    <!-- 關鍵 CSS 內聯 - 首屏渲染必需的樣式 -->
    <style>
      /* 重置和基礎樣式 */
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        line-height: 1.15;
        -webkit-text-size-adjust: 100%;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: #ffffff;
        color: #1f2937;
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #0b0f1a; color: #e5e7eb; }
        .loading-container { background-color: #0b0f1a; }
      }

      /* 載入指示器樣式 */
      .loading-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #f9fafb;
      }

      .loading-spinner {
        width: 2rem;
        height: 2rem;
        border: 2px solid #dcfce7;
        border-top: 2px solid #16a34a;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 0.75rem;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      .loading-text {
        font-size: 0.875rem;
        color: #6b7280;
        text-align: center;
      }

      /* 防止 FOUC (Flash of Unstyled Content) */
      .app-container {
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }

      .app-container.loaded {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/start.tsx"></script>
  </body>
</html>
