    <script>

      const pages = {

      const people = [

          status: "已發布",

        {
          name: "品牌與門市",
          file: "stores.txt",
          rev: 1,
          body: "第 1 節｜島嶼選物提供線上服務，暫無實體門市。",
          status: "已發布",
        },
      ];
      const st = {
        period: 7,
        selected: 0,
        owners: people.map(() => "waiting"),
        messages: people.map(() => []),
        doc: 0,
        policy: true,
        step: 0,
        connected: false,
        node: 1,
        title: "退換貨服務",
        body: "查看適用條件，或讓專人協助確認。",
        cta: "查看退換貨指南",
        keyword: "退貨",
        published: 3,
        tested: false,
        area: 0,
        areas: ["最新商品", "配送進度", "聯絡客服"],
        lang: "繁體中文",
        contactSel: new Set(),
        sim: null,
        runId: 0,
        revision: 0,
        showRuns: false,
      };
      let page, toastTimer;
      const pending = () => st.owners.filter((x) => x === "waiting").length;

      function table(heads, rows) {
        return (
          '<div class="tablebox"><table class="table"><thead><tr>' +
          heads.map((x) => '<th scope="col">' + x + "</th>").join("") +
          "</tr></thead><tbody>" +
          rows
            .map(
              (row) =>
                "<tr>" +
                row.map((x) => "<td>" + x + "</td>").join("") +
                "</tr>",
            )
            .join("") +
          "</tbody></table></div>"
        );
      }
      const week = [140, 174, 149, 176, 160, 214, 271],
        month = [
          183, 197, 168, 204, 218, 211, 237, 250, 199, 219, 240, 258, 268, 270,
          281, 266, 258, 284, 276, 258, 255, 279, 290, 282, 306, 293, 331, 309,
          326, 352,
        ];
      const sum = (xs) => xs.reduce((a, b) => a + b, 0);

      function traceHtml(r) {
        return (
          '<ol class="timeline">' +
          r.steps.map((x) => "<li>" + esc(x) + "</li>").join("") +
          '</ol><div class="choice"><strong>' +
          esc(r.label) +
          "</strong><p>" +
          esc(r.answer) +
          "</p></div>" +
          (r.ref !== null
            ? btn(
                "查看引用 · " + docs[r.ref].name,
                "source/" + r.ref,
                "linkbtn",
                "book-open",
              )
            : "")
        );
      }
      function simulator(input = "", target = null) {
        dialog(
          "測試 AI 助理",
          '<p class="sub">本機情境模擬。可試「未拆封可以退貨嗎」、「週日到貨」或沒有文件依據的問題。</p><form class="stack" data-form="sim"><label class="field">模擬好友訊息<input required name="q" maxlength="240" value="' +
            esc(input) +
            '" placeholder="未拆封可以退貨嗎？"></label><input type="hidden" name="target" value="' +
            (target ?? "") +
            '"><button class="primary">執行模擬</button></form><div id="simout" aria-live="polite"></div>',
        );
      }

      function render(focus = false) {
        page = location.hash.slice(1) || "overview";
        if (!Object.hasOwn(pages, page)) page = "missing";
        const screen =
          screens[page] ||
          ([
            "about",
            "guide",
            "terms",
            "privacy",
            "feedback",
            "missing",
          ].includes(page)
            ? support
            : auth);
        $("#app").innerHTML = (pub.has(page) ? publicShell : shell)(
          emptyScreen() ?? screen(),
        );
        document.title = pages[page] + " · Botlyn";
        if (focus) {
          window.scrollTo(0, 0);
          $("main").focus({ preventScroll: true });
        }
      }
      function route(id) {
        closeModal();
        if (location.hash === "#" + id) {
          render(true);
        } else location.hash = id;
      }
      function closeModal() {
        if ($("#modal").open) $("#modal").close();
      }
      function dialog(title, html) {
        const d = $("#modal");
        d.innerHTML =
          '<div class="stack"><div class="between"><h2 id="dialogTitle">' +
          esc(title) +
          '</h2><button class="iconbtn" data-act="close" aria-label="關閉">' +
          ic("x") +
          "</button></div>" +
          html +
          "</div>";
        d.setAttribute("aria-labelledby", "dialogTitle");
        if (!d.open) d.showModal();
        else d.querySelector("button").focus();
      }
      function toast(s) {
        $("#toast").textContent = s;
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => ($("#toast").textContent = ""), 2700);
      }
      function mapItems(q = "") {
        const keys = Object.keys(pages).filter((k) =>
          (pages[k] + k).toLowerCase().includes(q.toLowerCase()),
        );
        return keys.length
          ? keys
              .map(
                (k) =>
                  '<button data-act="go/' +
                  k +
                  '"><span>' +
                  pages[k] +
                  '</span><span class="count">' +
                  (pub.has(k) ? "公開頁" : "工作區") +
                  "</span></button>",
              )
              .join("")
          : '<p class="hint">沒有符合的頁面。</p>';
      }
      function showMap() {
        dialog(
          "全站導覽",
          '<input class="search" id="navSearch" aria-label="搜尋頁面" placeholder="搜尋頁面、功能…"><div class="mapitems" id="mapitems">' +
            mapItems() +
            "</div>",
        );
        $("#navSearch").focus();
      }
      function dirty() {
        st.tested = false;
        st.revision++;
      }
      function suggestSource() {
        dialog(
          "新增知識來源",
          '<form class="stack" data-form="source"><label class="field">讀入本機文字檔（選填）<input id="localSource" type="file" accept=".md,.txt,text/plain,text/markdown"></label><label class="field">文件名稱<input name="name" maxlength="50" required></label><label class="field">助理可讀原文<textarea name="body" maxlength="5000" required></textarea></label><p class="tiny">此原型支援 5,000 字內的純文字。內容只在此分頁記憶體中。</p><button class="primary">建立草稿</button></form>',
        );
      }
      function testFlow() {
        dialog(
          "測試流程草稿",
          '<form class="stack" data-form="flowtest"><label class="field">模擬好友訊息<input name="q" required value="' +
            esc(st.keyword) +
            '"></label><button class="primary">執行測試</button></form><div id="flowout" aria-live="polite"></div>',
        );
      }
      function action(s) {
        const [a, b] = s.split("/"),
          i = Number(b);
        if (studioAction(a, b, i)) return;
        switch (a) {
          case "go":
            route(b);
            break;
          case "map":
            showMap();
            break;
          case "close":
            closeModal();
            break;
          case "bot":
            dialog(
              "目前頻道",
              '<div class="choice"><strong>島嶼選物</strong><p class="sub">LINE 官方帳號 · 示範工作區</p></div>' +
                go("connection", "管理頻道連線", "primary") +
                go("connect", "體驗新增 Bot", "soft"),
            );
            break;
          case "person":
            st.selected = i;
            route("inbox");
            break;
          case "trace":
            st.selected = i;
            route("inbox");
            requestAnimationFrame(() => {
              if ($(".trace")) $(".trace").open = true;
            });
            break;
          case "claim":
            st.owners[st.selected] = "human";
            render();
            toast("已接手，自動回覆已暫停");
            break;
          case "release":
            st.owners[st.selected] = "ai";
            render();
            toast("已交還助理，等待重新判讀");
            break;
          case "source":
            st.doc = i;
            route("knowledge");
            break;
          case "doc":
            st.doc = i;
            render();
            break;
          case "addsource":
            suggestSource();
            break;
          case "publishdoc":
            docs[st.doc].status = "已發布";
            render();
            toast("文件已可供示範助理讀取");
            break;
          case "testdoc":
            simulator("請說明" + docs[st.doc].name, st.doc);
            break;
          case "simulate":
            simulator();
            break;
          case "policy":
            st.policy = !st.policy;
            render();
            toast(st.policy ? "已啟用示範接管" : "自動接管已暫停");
            break;
          case "node":
            st.node = i;
            render();
            break;
          case "testflow":
            testFlow();
            break;
          case "publishflow":
            if (!st.tested) {
              toast("請先測試目前的流程草稿");
              testFlow();
              break;
            }
            st.published++;
            st.tested = false;
            render();
            toast("已發布示範流程 v" + st.published);
            break;
          case "area":
            st.area = i;
            render();
            break;
          case "check":
            st.connected = true;
            render();
            toast("示範 Webhook 驗證通過");
            break;
          case "prev":
            st.step = Math.max(0, st.step - 1);
            render();
            break;
          case "next":
            if (st.step < 2) {
              st.step++;
              if (st.step === 2) st.connected = true;
              render();
            } else simulator();
            break;
          case "broadcast":
            if (!st.contactSel.size) {
              toast("請先勾選至少一位好友");
              break;
            }
            dialog(
              "群發預覽",
              "<p>" +
                Array.from(st.contactSel)
                  .map((j) => people[j].name)
                  .join("、") +
                '</p><form class="stack" data-form="broadcast"><label class="field">示範訊息<textarea name="text" required></textarea></label><button class="primary">查看訊息預覽</button></form>',
            );
            break;
          case "resend":
            toast("已重新產生示範驗證信");
            break;
          case "expired":
            dialog(
              "驗證連結已失效",
              "<p>可返回等待驗證頁重新寄送。</p>" +
                go("pending", "重寄驗證信", "primary"),
            );
            break;
        }
      }
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-act]");
        if (b) action(b.dataset.act);
      });
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          showMap();
        }
      });
      document.addEventListener("input", (e) => {
        const el = e.target;
        if (el.id === "navSearch")
          $("#mapitems").innerHTML = mapItems(el.value);
        if (el.dataset.flex)
          $("#card" + el.dataset.flex).textContent = el.value;
      });
      document.addEventListener("change", async (e) => {
        const el = e.target;
        if (el.dataset.change === "period") {
          st.period = Number(el.value);
          render();
        }
        if (el.dataset.change === "contact") {
          const i = Number(el.value);
          el.checked ? st.contactSel.add(i) : st.contactSel.delete(i);
          render();
        }
        if (el.id === "localSource" && el.files[0]) {
          const f = el.files[0],
            form = el.form;
          if (f.size > 25000 || !/(\.txt|\.md)$/i.test(f.name)) {
            toast("請選擇 5,000 字以內的 TXT 或 Markdown");
            el.value = "";
            return;
          }
          try {
            const t = await f.text();
            if (t.length > 5000) {
              toast("檔案超過 5,000 字");
              el.value = "";
              return;
            }
            form.elements.name.value = f.name.slice(0, 50);
            form.elements.body.value = t;
          } catch {
            toast("無法讀取檔案，請貼上文字");
          }
        }
      });
      document.addEventListener("submit", (e) => {
        const f = e.target;
        if (!f.dataset.form) return;
        e.preventDefault();
        const data = new FormData(f),
          get = (k) => String(data.get(k) || "").trim();
        if (studioSubmit(f, get)) return;
        switch (f.dataset.form) {
          case "reply":
            if (!get("text")) break;
            st.messages[st.selected].push(get("text"));
            render();
            toast("已加入本機對話");
            break;
          case "keyword":
            if (!get("word")) break;
            st.keyword = get("word");
            dirty();
            render();
            toast("條件已儲存至草稿");
            break;
          case "flex":
            if (!get("title") || !get("body") || !get("cta")) break;
            for (const k of ["title", "body", "cta"]) st[k] = get(k);
            dirty();
            render();
            toast("樣板已更新，請重新測試引用流程");
            break;
          case "flowtest": {
            const hit = get("q").includes(st.keyword),
              r = simulate(get("q"), null);
            st.tested = true;
            $("#flowout").innerHTML =
              '<div class="choice"><strong>測試通過 · ' +
              (hit ? "符合條件" : "其他訊息") +
              "</strong><p>" +
              (hit
                ? "收到文字 → 關鍵字命中 → " + esc(st.title)
                : "收到文字 → 交給助理 → " + esc(r.label)) +
              "</p></div>";
            render();
            break;
          }
          case "source":
            if (!get("name") || !get("body")) break;
            docs.push({
              name: get("name"),
              file:
                f.querySelector("input[type=file]")?.files?.[0]?.name ||
                "note.md",
              rev: 1,
              body: get("body"),
              status: "草稿",
            });
            st.doc = docs.length - 1;
            closeModal();
            render();
            toast("已建立知識草稿");
            break;
          case "sim": {
            const r = simulate(
              get("q"),
              get("target") === "" ? null : Number(get("target")),
            );
            const id = ++st.runId,
              out = $("#simout");
            out.innerHTML = '<p class="hint">正在比對來源與接管政策…</p>';
            setTimeout(
              () => {
                if (id === st.runId && out.isConnected)
                  out.innerHTML = traceHtml(r);
              },
              matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 260,
            );
            break;
          }
          case "area":
            if (!get("area")) break;
            st.areas[st.area] = get("area");
            render();
            toast("示範選單已儲存");
            break;
          case "language":
            st.lang = get("lang");
            render();

      function simulate(q, target) {
        if (!studio.enabled || !st.policy)

            answer: "此事件交給客服處理。",
          };
        let hits = docs
          .map((d, i) => ({ d, i }))
          .filter(
            ({ d }) =>
              d.status === "已發布" &&
              (q.includes(d.name) ||
                (/退|拆封/.test(q) && d.file === "returns.md") ||
                (/送|到貨|出貨/.test(q) && d.file === "shipping.pdf") ||
                (/門市/.test(q) && d.file === "stores.txt") ||
                (/會員|點數/.test(q) && d.file === "membership.md")),
          )
          .sort((a, b) => b.d.rev - a.d.rev);
        const id = target ?? hits[0]?.i,
          d = docs[id],
          allow = studio.tools.knowledge && d?.status === "已發布";
        if (!allow)
          return {
            label: "請求人工接手",
            ref: null,
            steps: [
              studio.tools.knowledge
                ? "搜尋已發布來源 → 沒有足夠依據"
                : "knowledge.read 未授權",
              "handoff.request → 等待客服",
            ],
            answer: "需要客服確認後才能回答。",
          };
        const hand = /已拆封|週日|修改.*地址/.test(q);
        return {
          label: hand ? "請求人工接手" : "可回覆",
          ref: id,
          steps: [
            `knowledge.search → ${d.name}`,
            `knowledge.read → ${d.file} · v${d.rev}`,
            hand
              ? "handoff.request → 例外案件"
              : "reply.propose → 引用已讀文件",

          answer: hand ? "我會請客服為您確認。" : d.body.split("｜").at(-1),

        const fo = node.parentElement;
        const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(

      const categoryLabels = {
        flow: "流程",
        flex: "Flex 樣板",
        menu: "圖文選單",
      };
      function initCatalog() {
        if (studio.catalog) return;
        studio.assetCategory = "flow";
        studio.chosen = { flow: 0, flex: 0, menu: 0 };
        studio.catalog = {
          flow: [
            {
              name: studio.flowName,
              keyword: st.keyword,
              link: 0,
              published: st.published,
            },
            { name: "配送諮詢", keyword: "配送", link: 1, published: 1 },
          ],
          flex: [
            {
              name: st.title,
              title: st.title,
              body: st.body,
              cta: st.cta,
              alt: studio.flexAlt,
              accent: studio.accent,
              photo: true,
            },
            {
              name: "配送進度卡",
              title: "查看配送進度",
              body: "付款確認後，兩個工作日內安排出貨。",
              cta: "查詢配送",
              alt: "配送進度說明",
              accent: "#985d42",
              photo: true,
            },
          ],
          menu: [
            {
              name: studio.menuName,
              areas: [...st.areas],
              values: [...studio.areaValues],
              modes: [...studio.menuMode],
              shape: studio.menuShape,
            },
            {
              name: "客服快捷選單",
              areas: ["退換貨", "配送說明", "人工客服"],
              values: ["退貨", "配送", "請接人工"],
              modes: ["message", "message", "message"],
              shape: "split",
            },
          ],
        };
      }
      function currentAsset(k) {
        initCatalog();
        return studio.catalog[k][studio.chosen[k]];
      }
      function persistAsset(k) {
        let a = currentAsset(k);
        if (k === "flow")
          Object.assign(a, {
            name: studio.flowName,
            keyword: st.keyword,
            published: st.published,
            extra: studio.extra,
            offsets: structuredClone(studio.offsets),
            versions: structuredClone(studio.versions),
            tested: st.tested,
          });
        if (k === "flex")
          Object.assign(a, {
            name: st.title,
            title: st.title,
            body: st.body,
            cta: st.cta,
            alt: studio.flexAlt,
            accent: studio.accent,
            photo: studio.photo,
            align: studio.align,
          });
        if (k === "menu")
          Object.assign(a, {
            name: studio.menuName,
            areas: [...st.areas],
            modes: [...studio.menuMode],
            values: [...studio.areaValues],
            shape: studio.menuShape,
            revision: studio.menuRevision,
            live: studio.menuLive,
          });
      }
      function selectAsset(k, i) {
        initCatalog();
        persistAsset(k);
        studio.chosen[k] = i;
        const a = currentAsset(k);
        if (k === "flow") {
          Object.assign(st, {
            keyword: a.keyword,
            published: a.published ?? 0,
            node: 1,
            tested: !!a.tested,
          });
          Object.assign(studio, {
            flowName: a.name,
            extra: a.extra,
            offsets: structuredClone(a.offsets || {}),
            versions: structuredClone(a.versions || []),
            flowTab: "inspect",
          });
        } else if (k === "flex") {
          Object.assign(st, { title: a.title, body: a.body, cta: a.cta });
          Object.assign(studio, {
            flexAlt: a.alt,
            accent: a.accent,
            photo: a.photo,
            align: a.align || "left",
          });
        } else {
          st.area = 0;
          st.areas = [...a.areas];
          Object.assign(studio, {
            menuName: a.name,
            menuShape: a.shape,
            areaValues: [...a.values],
            menuMode: [...a.modes],
            menuRevision: a.revision || 1,
            menuLive: !!a.live,
          });
        }
      }
      function linkedTemplate() {
        initCatalog();
        const f = currentAsset("flow");
        return f.link === studio.chosen.flex
          ? st.title
          : studio.catalog.flex[f.link].title;
      }
      function assets() {
        initCatalog();
        for (const k of Object.keys(categoryLabels)) persistAsset(k);
        const k = studio.assetCategory;
        return (
          heading(
            page,
            "統一管理可編輯的流程、訊息卡片與頻道選單。",
            btn("新增" + categoryLabels[k], "newasset", "primary", "plus"),
          ) +
          tabs(Object.entries(categoryLabels), k, "catalogtab") +
          `<div class="assetgrid">${studio.catalog[k].map((a, i) => `<article class="assetpreview"><button class="assetcover cover-${k}" data-act="openasset/${i}" aria-label="開啟${esc(a.name)}">${k === "flow" ? `<span>${ic("message-square")}</span><i></i><span>${ic("split")}</span><i></i><span>${ic("orbit")}</span>` : k === "flex" ? `<div class="miniasset"><div class="product"></div><b>${esc(a.title)}</b></div>` : `<div class="minimenu product">${a.areas.map((n) => `<b>${esc(n)}</b>`).join("")}</div>`}</button><div class="assetdetail"><div><small class="overline">${categoryLabels[k]}</small><h2>${esc(a.name)}</h2></div><div class="actions">${btn("編輯", "openasset/" + i, "primary", "pencil")}${btn("複製", "dupasset/" + i, "soft", "copy")}</div></div></article>`).join("")}</div>`
        );
      }
      function assetAction(a, b, i) {
        switch (a) {
          case "switchspace":
            activateSpace(b);
            route("overview");
            return true;
          case "editspace":
            activateSpace(b);
            route("connection");
            return true;
          case "newchannel":
            st.step = 0;
            studio.checkFail = false;
            studio.connectName = "新的 LINE 頻道";
            route("connect");
            return true;
          case "finishconnect": {
            const name = studio.connectName;
            if (name === studio.bot) {
              st.connected = true;
              studio.latestCheck = "剛剛";
            } else createSpace(name);
            route("connection");
            return true;
          }
          case "deletespace":
            dialog(
              "移除示範頻道？",
              `<p>移除「${esc(channelInfo.get(b).name)}」及其本機示範資料。</p>${btn("確認移除", "confirmdelspace/" + b, "danger")}`,
            );
            return true;
          case "confirmdelspace":
            if (b === "island") return true;
            if (activeChannel === b) activateSpace("island");
            channelInfo.delete(b);
            workspaceCopies.delete(b);
            closeModal();
            render();
            return true;
          case "assetlib":
            initCatalog();
            studio.assetCategory = b;
            route("assets");
            return true;
          case "catalogtab":
            studio.assetCategory = b;
            render();
            return true;
          case "openasset":
            selectAsset(studio.assetCategory, i);
            route(studio.assetCategory);
            return true;
          case "linkedflex":
            selectAsset("flex", currentAsset("flow").link);
            route("flex");
            return true;
          case "chooseflex":
            dialog(
              "選擇此流程的回覆樣板",
              studio.catalog.flex
                .map((f, i) =>
                  btn(f.title, "setflex/" + i, "soft", "panels-top-left"),
                )
                .join(""),
            );
            return true;
          case "setflex":
            currentAsset("flow").link = i;
            dirty();
            closeModal();
            render();
            return true;
          case "dupasset": {
            const k = studio.assetCategory,
              v = structuredClone(studio.catalog[k][i]);
            v.name += " 副本";
            if (k === "flex") v.title = v.name;
            v.published = 0;
            v.live = false;
            v.tested = false;
            v.versions = [];
            studio.catalog[k].push(v);
            render();
            toast("已建立副本");
            return true;
          }
          case "newasset":
            dialog(
              "建立" + categoryLabels[studio.assetCategory],
              `<form data-form="newasset" class="stack">${field("name", "名稱", "", "text", 'required maxlength="40"')}<p class="helper">從目前工作區的基礎版型開始編輯。</p>${submit("建立草稿", "plus")}</form>`,
            );
            return true;
          default:
            return false;
        }
      }

      render();
    </script>
  </body>
</html>
