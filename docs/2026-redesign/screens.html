const pages=Object.values(groups).flat();let filter='全部',device='desktop',current=-1,invoker=null;
const $=s=>document.querySelector(s);
function buttons(root){$(root).innerHTML=[['desktop','桌面'],['phone','手機']].map(([k,l])=>'<button type="button" data-size="'+k+'" aria-pressed="'+(device===k)+'" class="'+(device===k?'active':'')+'">'+l+'</button>').join('')}
function draw(){buttons('#sizes');buttons('#readerSizes');$('#filters').innerHTML=['全部',...Object.keys(groups)].map(g=>'<button type="button" data-g="'+g+'" aria-pressed="'+(g===filter)+'" class="'+(g===filter?'active':'')+'">'+g+'</button>').join('');const q=$('#find').value.trim().toLowerCase();$('#groups').className=device;$('#groups').innerHTML=Object.entries(groups).filter(([g])=>filter==='全部'||g===filter).map(([g,all])=>{const rows=all.filter(r=>r.join(' ').toLowerCase().includes(q));return rows.length?'<section class="group"><h2>'+g+' <small>'+rows.length+'</small></h2><div class="grid">'+rows.map(([id,title,sub])=>'<a class="tile" data-id="'+id+'" href="index.html#'+id+'"><div class="thumb"><img loading="lazy" alt="'+title+'實際截圖" src="'+thumbs[id][device]+'"></div><div class="foot"><div><b>'+title+'</b><small>'+sub+'</small></div><i>↗</i></div></a>').join('')+'</div></section>':''}).join('')||'<p class="empty">找不到符合的畫面。</p>';$('#framewrap').classList.toggle('narrow',device==='phone')}
function sync(){const [id,title]=pages[current];$('#num').textContent=(current+1)+' / '+pages.length;$('#standalone').href='index.html#'+id;$('#pick').value=id;document.title=title+' · 全站預覽';$('iframe').title=title+'互動預覽'}
function openPage(id){const i=pages.findIndex(p=>p[0]===id);if(i<0)return;current=i;if(!$('#framewrap iframe')){const frame=document.createElement('iframe');$('#framewrap').append(frame)}$('iframe').src='index.html#'+id;$('#viewer').hidden=false;$('#catalog').inert=true;$('header').inert=true;document.body.style.overflow='hidden';sync();$('#pick').focus()}
function closePage(){current=-1;$('#viewer').hidden=true;$('#framewrap').replaceChildren();$('#catalog').inert=false;$('header').inert=false;document.body.style.overflow='';document.title='全站逐頁預覽 · Botlyn Studio';invoker?.focus()}
function move(step){const i=(current+step+pages.length)%pages.length;openPage(pages[i][0])}
$('#pick').innerHTML=Object.entries(groups).map(([g,rows])=>'<optgroup label="'+g+'">'+rows.map(([k,t])=>'<option value="'+k+'">'+t+'</option>').join('')+'</optgroup>').join('');
document.addEventListener('click',e=>{const el=e.target.closest('button,a');if(!el)return;if(el.dataset.id&&!e.metaKey&&!e.ctrlKey){e.preventDefault();invoker=el;openPage(el.dataset.id)}if(el.dataset.g){filter=el.dataset.g;draw()}if(el.dataset.size){device=el.dataset.size;draw()}});
$('#pick').onchange=e=>openPage(e.target.value);$('#back').onclick=closePage;$('#prev').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#find').oninput=draw;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&current>=0)closePage()});
window.addEventListener('message',e=>{if(e.source!==document.querySelector('iframe')?.contentWindow||e.data?.kind!=='botlyn-route')return;let i=pages.findIndex(p=>p[0]===e.data.page);if(i>=0){current=i;sync()}});draw();
</script></body></html>
